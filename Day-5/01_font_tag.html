<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Font Tag Example</title>
</head>

<body>

    <h2>Font Tag Demonstration (Deprecated)</h2>
    <p><strong>Author:</strong> Ajit Kumar</p>

    <hr>

    <font color="red">This is red colored text.</font><br>

    <font size="5">This is larger text.</font><br>

    <font face="Verdana">This text uses Verdana font.</font><br>

    <font face="Impact">This text uses Impact font.</font><br>

    <font face="Monaco">This text uses Monaco font.</font>

    <p>
        <font color="blue" size="6" face="Impact">
            This is the final styled line.
        </font>
    </p>

</body>

</html>
